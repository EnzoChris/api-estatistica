name: CI e CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Formatação
        run: ruff format --check .
      - name: Testes unitários e de integração com cobertura
        run: pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80 --junitxml=test-results.xml
      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: Build e teste da imagem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem
        run: docker build -t api-estatistica:ci .
      - name: Verificar inicialização e endpoint
        run: |
          docker run -d --name api-estatistica -p 8000:8000 api-estatistica:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/openapi.json > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs api-estatistica
          exit 1

  deploy:
    name: Solicitar deploy no Render
    needs: [quality, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enviar commit validado ao Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo "Configure o secret RENDER_DEPLOY_HOOK"; exit 1; }
          curl --fail --silent --show-error --request POST "${RENDER_DEPLOY_HOOK}&ref=${COMMIT_SHA}"
