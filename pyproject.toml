[project]
name = "api-covariancia-correlacao"
version = "0.1.0"
description = "API para cálculo de covariância e correlação"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "numpy>=2.2.0",
    "pydantic>=2.10.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
]